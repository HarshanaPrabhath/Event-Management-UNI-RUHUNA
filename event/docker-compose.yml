services:
  mysql:
    image: mysql:8.0
    container_name: events_db
    restart: always
    environment:
      MYSQL_DATABASE: events
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-2003}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - event_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: ghcr.io/${IMAGE_NAME:-induwara90/event-management-uni-ruhuna}:latest
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_manage_app
    restart: always
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-2003}
      JWT_SECRET: ${JWT_SECRET:-K+Ys0/ucnzGZ+Q4UQs9rC+QN27PnUhcTXk6QYQMFBHUitkOs6xYhtLlE8Smyo5GjTDfSNNqdONH5jYqoSNOUKg==}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/events?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SERVER_PORT: 8081
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - event_network

  frontend:
    image: ghcr.io/${FRONTEND_IMAGE_NAME:-induwara90/event-management-frontend}:latest
    pull_policy: missing
    container_name: event_manage_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    networks:
      - event_network

volumes:
  mysql_data:
  uploads_data:

networks:
  event_network:
    driver: bridge
