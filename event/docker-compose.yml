services:

  mysql:
    image: mysql:8.0
    container_name: events_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: events
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - event_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/harshanaprabhath/event-manage:latest
    container_name: event_manage_app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/events?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - event_network

volumes:
  mysql_data:
  uploads_data:

networks:
  event_network:
    driver: bridge