spring:
  application:
    name: event_manage

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/events?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2003}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8081}

app:
  jwt:
    # Dev-only fallback so `mvn spring-boot:run` works out of the box. Real deployments must set
    # JWT_SECRET (see docker-compose.yml / .env) to their own secret - never reuse this one.
    secret: ${JWT_SECRET:K+Ys0/ucnzGZ+Q4UQs9rC+QN27PnUhcTXk6QYQMFBHUitkOs6xYhtLlE8Smyo5GjTDfSNNqdONH5jYqoSNOUKg==}
    expiration-ms: 86400000
  notifications:
    email:
      enabled: ${APP_NOTIFICATIONS_EMAIL_ENABLED:false}
      from: ${APP_NOTIFICATIONS_EMAIL_FROM:}

file:
  upload-dir: /app/uploads
