# Production stack on the VM. Pulled by GitHub Actions after every push to main.
# Place this folder on the VM at /opt/event-management (see DEPLOY.md).

services:
  mysql:
    image: mysql:8.0
    container_name: events_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: events
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${MYSQL_PUBLISH_PORT:-127.0.0.1:3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - event_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    image: ghcr.io/${BACKEND_IMAGE:-induwara90/event-management-uni-ruhuna}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: event_manage_app
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/events?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SERVER_PORT: 8081
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_COOKIE_SAME_SITE: ${APP_COOKIE_SAME_SITE:-Lax}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - event_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/check"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  frontend:
    image: ghcr.io/${FRONTEND_IMAGE:-induwara90/event-management-frontend}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: event_manage_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - event_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
  uploads_data:

networks:
  event_network:
    driver: bridge
